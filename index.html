<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>林一 · 个人博客</title>
<meta name="description" content="前端工程师林一的个人博客，记录关于代码、设计与生活的思考。">
<style>
  /* ---------- 主题变量 ---------- */
  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --text: #18181d;
    --text-2: #5b6270;
    --muted: #8b90a0;
    --border: #e7e7ef;
    --accent: #6366f1;
    --accent-2: #a855f7;
    --accent-soft: rgba(99, 102, 241, .09);
    --nav-bg: rgba(251, 251, 253, .78);
    --shadow-hover: 0 2px 4px rgba(16, 18, 30, .05), 0 16px 40px rgba(16, 18, 30, .10);
  }

  [data-theme="dark"] {
    --bg: #0e1014;
    --surface: #16191f;
    --text: #e9eaf0;
    --text-2: #a9b0be;
    --muted: #7c8394;
    --border: #262b34;
    --accent: #818cf8;
    --accent-2: #c084fc;
    --accent-soft: rgba(129, 140, 248, .13);
    --nav-bg: rgba(14, 16, 20, .75);
    --shadow-hover: 0 2px 6px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .35);
  }

  /* ---------- 基础 ---------- */
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 84px;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 99px;
    border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .container { width: min(1080px, 100% - 2.5rem); margin-inline: auto; }

  /* ---------- 导航 ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 64px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: .6rem;
    font-weight: 600;
    font-size: .95rem;
    letter-spacing: -.01em;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: .82rem;
    font-weight: 600;
  }

  .nav-links {
    display: flex;
    gap: 1.7rem;
    margin-left: auto;
    font-size: .9rem;
    color: var(--text-2);
  }

  .nav-links a { transition: color .2s ease; }
  .nav-links a:hover { color: var(--accent); }

  .theme-toggle {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    transition: all .22s ease;
  }

  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); transform: rotate(-12deg); }
  .theme-toggle svg { width: 18px; height: 18px; }

  [data-theme="light"] .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }

  /* ---------- Hero ---------- */
  .hero {
    text-align: center;
    padding: 5rem 0 3.5rem;
  }

  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 1.5rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 2rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 14px 34px -12px var(--accent);
  }

  .hero-title {
    margin: 0 0 .8rem;
    font-size: clamp(1.9rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.25;
  }

  .gradient {
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-sub {
    max-width: 34em;
    margin: 0 auto 1.9rem;
    color: var(--text-2);
    font-size: 1.02rem;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: .7rem;
  }

  .social {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    transition: all .22s ease;
  }

  .social:hover {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    transform: translateY(-3px);
  }

  .social svg { width: 18px; height: 18px; }

  /* ---------- 主布局 ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 296px;
    gap: 3rem;
    align-items: start;
    padding-bottom: 5rem;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    margin-bottom: 1.4rem;
  }

  .section-head h2 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: -.015em;
  }

  .count { font-size: .82rem; color: var(--muted); }

  /* ---------- 文章卡片 ---------- */
  .post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.5rem;
    margin-bottom: 1rem;
    transition: transform .28s cubic-bezier(.2, .7, .3, 1),
                box-shadow .28s ease,
                border-color .28s ease;
  }

  .post:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }

  .post-meta {
    display: flex;
    align-items: center;
    gap: .55rem;
    margin-bottom: .55rem;
    font-size: .78rem;
    color: var(--muted);
  }

  .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: .55;
  }

  .post-title {
    margin: 0 0 .5rem;
    font-size: 1.18rem;
    line-height: 1.45;
    letter-spacing: -.01em;
  }

  .post-title a { transition: color .2s ease; }
  .post-title a:hover { color: var(--accent); }

  .post-excerpt {
    margin: 0 0 1rem;
    color: var(--text-2);
    font-size: .92rem;
    line-height: 1.75;
  }

  .post-tags { display: flex; flex-wrap: wrap; gap: .4rem; }

  .tag {
    padding: .22rem .62rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .74rem;
    font-weight: 500;
  }

  .empty {
    padding: 3rem 0;
    text-align: center;
    color: var(--muted);
    font-size: .92rem;
  }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    position: sticky;
    top: 84px;
  }

  .widget {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem 1.3rem;
  }

  .widget h3 {
    margin: 0 0 .9rem;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .widget p {
    margin: 0;
    font-size: .88rem;
    color: var(--text-2);
    line-height: 1.8;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
    margin-top: 1.1rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
  }

  .stats div { display: flex; flex-direction: column; }
  .stats strong { font-size: 1.25rem; letter-spacing: -.02em; }
  .stats span { font-size: .76rem; color: var(--muted); }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: .45rem; }

  .cloud-tag {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    padding: .3rem .7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: .8rem;
    cursor: pointer;
    transition: all .2s ease;
  }

  .cloud-tag:hover { border-color: var(--accent); color: var(--accent); }

  .cloud-tag.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
  }

  .cloud-tag .num { font-size: .7rem; opacity: .65; }

  .subscribe-form { display: flex; gap: .5rem; }

  .subscribe-form input {
    flex: 1;
    min-width: 0;
    padding: .55rem .8rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: .88rem;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .subscribe-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .subscribe-form button {
    padding: .55rem 1rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-family: inherit;
    font-size: .88rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .2s ease, transform .2s ease;
  }

  .subscribe-form button:hover { opacity: .9; transform: translateY(-1px); }
  .subscribe-form button:active { transform: translateY(0); }

  .form-msg {
    min-height: 1.3em;
    margin-top: .6rem;
    font-size: .8rem;
    color: var(--accent);
  }

  /* ---------- 页脚 ---------- */
  .footer {
    border-top: 1px solid var(--border);
    padding: 2rem 0 2.5rem;
  }

  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: .75rem;
    font-size: .85rem;
    color: var(--muted);
  }

  .footer-links { display: flex; gap: 1.2rem; }
  .footer-links a { transition: color .2s ease; }
  .footer-links a:hover { color: var(--accent); }

  /* ---------- 入场动画 ---------- */
  .reveal { opacity: 0; }

  .reveal.visible {
    animation: fadeUp .55s cubic-bezier(.2, .7, .3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; }
    .reveal.visible { animation: none; }
    * { transition-duration: .01ms !important; }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; gap: 2rem; }
    .sidebar { position: static; }
  }

  @media (max-width: 560px) {
    .nav-links { display: none; }
    .theme-toggle { margin-left: auto; }
    .hero { padding: 3.5rem 0 2.5rem; }
    .post { padding: 1.2rem 1.15rem; }
    .subscribe-form { flex-wrap: wrap; }
    .subscribe-form button { flex: 1; }
  }
</style>
</head>
<body>

  <!-- 导航 -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#top">
        <span class="brand-mark">林</span>

      </a>

        <a href="#posts">文章</a>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"

          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>

  </header>

  <!-- Hero -->
  <section class="hero container" id="top">

    <p class="hero-sub">

    <div class="socials">
      <a class="social" href="#" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.48A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
        </svg>
      </a>
      <a class="social" href="#" aria-label="邮箱" title="邮箱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m2 7 10 6 10-6"/>
        </svg>
      </a>
      <a class="social" href="#" aria-label="RSS 订阅" title="RSS">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/>
          <circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- 主体 -->
  <main class="container layout" id="posts">
    <div class="posts-col">
      <div class="section-head">
        <h2>最新文章</h2>
        <span class="count" id="postCount"></span>
      </div>
      <div id="postList"></div>
    </div>

    <aside class="sidebar">
      <section class="widget" id="about">
        <h3>关于本站</h3>
        <p>
          这里记录我在前端开发、设计和个人生活中的思考与实验。
          更新随缘，但每一篇都认真写。
        </p>
        <div class="stats">
          <div><strong id="statPosts">0</strong><span>篇文章</span></div>
          <div><strong id="statTags">0</strong><span>个标签</span></div>
        </div>
      </section>

      <section class="widget">
        <h3>标签</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </section>

      <section class="widget" id="subscribe">
        <h3>订阅更新</h3>
        <form class="subscribe-form" id="subscribeForm" novalidate>
          <input type="email" placeholder="你的邮箱" aria-label="邮箱地址" required>
          <button type="submit">订阅</button>

        <div class="form-msg" id="formMsg"></div>
      </section>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>© 2026 林一 · 用心记录每一天</span>
      <div class="footer-links">
        <a href="#">RSS</a>
        <a href="#">GitHub</a>
        <a href="#top">回到顶部</a>
      </div>
    </div>
  </footer>

<script>
(function () {
  'use strict';

  /* ========== 1. 文章数据（改这里就行） ========== */
  const posts = [
    {
      date: '2026-09-18',
      title: '用 CSS 变量构建一套可切换的主题系统',
      excerpt: '从零搭建一套可维护的配色方案：为什么要把颜色抽成变量、如何优雅地支持深色模式，以及几个我踩过的坑。',
      tags: ['CSS', '前端'],
      readTime: '6 分钟',
      url: '#'
    },
    {
      date: '2026-09-09',
      title: '我为什么还在写博客',
      excerpt: '在短视频和碎片化阅读的时代，坚持写长文看起来有点笨。但正是这种"笨"，帮我理清了脑子里一团乱麻的想法。',
      tags: ['随笔'],
      readTime: '4 分钟',
      url: '#'
    },
    {
      date: '2026-08-27',
      title: '从零实现一个极简的响应式栅格',
      excerpt: '不用框架，只用 Grid 和几个媒体查询，做一个够用、好懂、不臃肿的 12 列栅格系统。',
      tags: ['CSS', '布局'],
      readTime: '8 分钟',
      url: '#'
    },
    {
      date: '2026-08-15',
      title: '在喧嚣里保持专注的五个习惯',
      excerpt: '关掉推送只是第一步。真正有效的是重新设计你的工作环境，以及学会对不重要的事情说"不"。',
      tags: ['生活', '效率'],
      readTime: '5 分钟',
      url: '#'
    },
    {
      date: '2026-07-30',
      title: '一次缓慢的胶片摄影尝试',
      excerpt: '一卷 36 张，拍了两周。不能回看、不能删除，反而让我重新学会了在按下快门前多想一秒。',
      tags: ['摄影', '生活'],
      readTime: '7 分钟',
      url: '#'
    },
    {
      date: '2026-07-12',
      title: 'JavaScript 里那些容易被忽略的细节',
      excerpt: '可选链、空值合并、structuredClone、以及 ?? 和 || 的真实区别——整理一些日常开发中真正用得上的小知识。',
      tags: ['JavaScript', '前端'],
      readTime: '9 分钟',
      url: '#'
    }
  ];

  /* ========== 2. 工具函数 ========== */
  function formatDate(iso) {
    const parts = iso.split('-').map(Number);
    return parts[0] + ' 年 ' + parts[1] + ' 月 ' + parts[2] + ' 日';
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ========== 3. 主题切换 ========== */
  const root = document.documentElement;
  const stored = localStorage.getItem('blog-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = stored || (prefersDark ? 'dark' : 'light');

  document.getElementById('themeToggle').addEventListener('click', function () {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('blog-theme', root.dataset.theme);
  });

  /* ========== 4. 渲染文章列表 ========== */
  const postList = document.getElementById('postList');
  const postCount = document.getElementById('postCount');
  const state = { tag: null };

  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  }, { rootMargin: '0px 0px -30px 0px', threshold: 0.05 });

  function renderPosts() {
    const list = state.tag
      ? posts.filter(function (p) { return p.tags.indexOf(state.tag) !== -1; })
      : posts;

    postCount.textContent = state.tag
      ? '筛选「' + state.tag + '」共 ' + list.length + ' 篇'
      : '共 ' + list.length + ' 篇';

    if (!list.length) {
      postList.innerHTML = '<p class="empty">这里还没有文章。</p>';
      return;
    }

    postList.innerHTML = list.map(function (p, i) {
      const delay = Math.min(i, 6) * 60;
      const tags = p.tags.map(function (t) {
        return '<span class="tag">' + escapeHTML(t) + '</span>';
      }).join('');

      return '' +
        '<div class="reveal" style="animation-delay:' + delay + 'ms">' +
          '<article class="post">' +
            '<div class="post-meta">' +
              '<time datetime="' + p.date + '">' + formatDate(p.date) + '</time>' +
              '<span class="dot"></span>' +
              '<span>' + escapeHTML(p.readTime) + '</span>' +
            '</div>' +
            '<h2 class="post-title">' +
              '<a href="' + (p.url || '#') + '">' + escapeHTML(p.title) + '</a>' +
            '</h2>' +
            '<p class="post-excerpt">' + escapeHTML(p.excerpt) + '</p>' +
            '<div class="post-tags">' + tags + '</div>' +
          '</article>' +
        '</div>';
    }).join('');

    postList.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  }

  /* ========== 5. 标签云 ========== */
  const tagCloud = document.getElementById('tagCloud');
  const tagCounts = {};

  posts.forEach(function (p) {
    p.tags.forEach(function (t) {
      tagCounts[t] = (tagCounts[t] || 0) + 1;
    });
  });

  function renderTags() {
    const entries = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a];
    });

    tagCloud.innerHTML = entries.map(function (t) {
      const active = state.tag === t ? ' active' : '';
      return '<button class="cloud-tag' + active + '" data-tag="' + escapeHTML(t) + '">' +
               escapeHTML(t) + '<span class="num">' + tagCounts[t] + '</span>' +
             '</button>';
    }).join('');
  }

  tagCloud.addEventListener('click', function (e) {
    const btn = e.target.closest('.cloud-tag');
    if (!btn) return;
    const t = btn.dataset.tag;
    state.tag = (state.tag === t) ? null : t;
    renderTags();
    renderPosts();
  });

  /* ========== 6. 统计数字 ========== */
  document.getElementById('statPosts').textContent = posts.length;
  document.getElementById('statTags').textContent = Object.keys(tagCounts).length;

  /* ========== 7. 订阅表单 ========== */
  const form = document.getElementById('subscribeForm');
  const formMsg = document.getElementById('formMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const input = form.querySelector('input');
    const value = input.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

    if (!valid) {
      formMsg.textContent = '请输入有效的邮箱地址';
      formMsg.style.color = '#ef4444';
      input.focus();
      return;
    }

    formMsg.style.color = '';
    formMsg.textContent = '订阅成功，感谢关注！';
    input.value = '';

    setTimeout(function () { formMsg.textContent = ''; }, 3200);
  });

  /* ========== 8. 初始化 ========== */
  renderTags();
  renderPosts();
})();
</script>
</body>
</html>
